name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core must be standard-library only
        run: python scripts/check_core_deps.py

      - name: Unit tests (unittest, no third-party dependencies)
        run: python -m unittest discover -s tests -t .

      - name: Install pytest (dev-only)
        run: python -m pip install --disable-pip-version-check pytest

      - name: Unit tests via pytest
        run: python -m pytest

      - name: CLI demo smoke test
        run: |
          python -m exfil_guard demo --json > demo.json
          python -c "import json; d=json.load(open('demo.json', encoding='utf-8')); assert all(d['assertions'].values()); assert d['summary']['high'] >= 3; assert d['cleaned_summary']['high'] == 0"

      - name: Demo pages are deterministic
        run: |
          python scripts/build_demo.py
          git diff --exit-code -- docs/demo_chat.html docs/demo_clean.html

      - name: Examples are deterministic
        run: |
          python scripts/gen_examples.py
          git diff --exit-code -- examples/

      - name: CI gate catches exfiltration (expected exit code 1)
        run: |
          set +e
          python -m exfil_guard scan examples/poisoned_chat.md --fail-on high
          code=$?
          set -e
          echo "scan exit code: $code"
          test "$code" -eq 1

      - name: CI gate passes clean output (expected exit code 0)
        run: python -m exfil_guard scan examples/clean_chat.md --fail-on low

      - name: Cleaned output no longer triggers the gate (expected exit code 0)
        run: |
          python -m exfil_guard clean examples/poisoned_chat.md -o cleaned.md
          python -m exfil_guard scan cleaned.md --fail-on low

      - name: JSON Schemas validate emitted reports
        run: python -m unittest tests.test_schema -v
